<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>voronoi</title>
  <style>
    :root { --sz: 422px; }
    @media (min-width: 1440px) { :root { --sz: 576px; } }
    @media (max-width: 480px)  { :root { --sz: 322px; } }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; font-family: system-ui, sans-serif; cursor: none;
    }
    #wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    canvas {
      width: var(--sz); height: var(--sz);
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); display: block;
    }
    #meta { display: flex; align-items: center; gap: 24px; }
    #label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="meta">
      <span id="label">voronoi — move + click</span>
    </div>
  </div>
<script>
  const SZ  = 422;
  const K   = 22;   // number of seeds
  const AVOID_R  = 95;
  const AVOID_W  = 3.8;
  const MAX_SPEED = 32;
  const DAMP = 0.96;

  const canvas = document.getElementById('c');
  canvas.width = canvas.height = SZ;
  const ctx = canvas.getContext('2d');

  let mx = SZ/2, my = SZ/2, isInside = false;

  // Seeds with position + velocity
  const seeds = [];
  for (let i = 0; i < K; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 8 + Math.random() * 16;
    seeds.push({
      x:  40 + Math.random() * (SZ - 80),
      y:  40 + Math.random() * (SZ - 80),
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
    });
  }

  // ── Exact Voronoi via half-plane intersection (Sutherland-Hodgman) ──
  function clipByHalfplane(poly, bx, by, nx, ny) {
    if (poly.length === 0) return [];
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const curr = poly[i];
      const next = poly[(i + 1) % poly.length];
      const dc = (curr.x - bx)*nx + (curr.y - by)*ny;
      const dn = (next.x - bx)*nx + (next.y - by)*ny;
      if (dc <= 0) out.push(curr);
      if ((dc < 0 && dn > 0) || (dc > 0 && dn < 0)) {
        const t = dc / (dc - dn);
        out.push({ x: curr.x + t*(next.x-curr.x), y: curr.y + t*(next.y-curr.y) });
      }
    }
    return out;
  }

  function computeCell(idx) {
    let poly = [
      {x: -5, y: -5}, {x: SZ+5, y: -5},
      {x: SZ+5, y: SZ+5}, {x: -5, y: SZ+5}
    ];
    const si = seeds[idx];
    for (let j = 0; j < K; j++) {
      if (j === idx || poly.length === 0) continue;
      const sj = seeds[j];
      const bx = (si.x + sj.x) / 2;
      const by = (si.y + sj.y) / 2;
      const nx = sj.x - si.x;
      const ny = sj.y - si.y;
      poly = clipByHalfplane(poly, bx, by, nx, ny);
    }
    return poly;
  }

  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mx = (e.clientX - r.left) * (SZ / r.width);
    my = (e.clientY - r.top)  * (SZ / r.height);
    isInside = true;
    maybeTick(e.clientX, e.clientY);
  });
  canvas.addEventListener('mouseenter', () => isInside = true);
  canvas.addEventListener('mouseleave', () => isInside = false);

  canvas.addEventListener('pointerdown', e => {
    const r  = canvas.getBoundingClientRect();
    const ex = (e.clientX - r.left) * (SZ / r.width);
    const ey = (e.clientY - r.top)  * (SZ / r.height);
    seeds.forEach(s => {
      const dx = s.x - ex, dy = s.y - ey;
      const d = Math.sqrt(dx*dx + dy*dy) + 1;
      s.vx += (dx/d) * 1800 / d;
      s.vy += (dy/d) * 1800 / d;
      const spd = Math.sqrt(s.vx*s.vx + s.vy*s.vy);
      if (spd > 180) { s.vx = s.vx/spd*180; s.vy = s.vy/spd*180; }
    });
    playClick();
  });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0], r = canvas.getBoundingClientRect();
    mx = (t.clientX - r.left) * (SZ / r.width);
    my = (t.clientY - r.top)  * (SZ / r.height);
    isInside = true;
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0], r = canvas.getBoundingClientRect();
    mx = (t.clientX - r.left) * (SZ / r.width);
    my = (t.clientY - r.top)  * (SZ / r.height);
  }, { passive: false });
  canvas.addEventListener('touchend', () => isInside = false);

  function update(dt) {
    seeds.forEach(s => {
      // Cursor avoidance
      if (isInside) {
        const dx = s.x - mx, dy = s.y - my;
        const d = Math.sqrt(dx*dx + dy*dy) + 0.1;
        if (d < AVOID_R) {
          const str = (1 - d/AVOID_R) * AVOID_W;
          s.vx += (dx/d) * MAX_SPEED * str * dt * 60;
          s.vy += (dy/d) * MAX_SPEED * str * dt * 60;
        }
      }

      // Boundary bounce
      const PAD = 30;
      if (s.x < PAD)      s.vx += (PAD - s.x)        * 5 * dt * 60;
      if (s.x > SZ-PAD)   s.vx -= (s.x - (SZ-PAD))   * 5 * dt * 60;
      if (s.y < PAD)      s.vy += (PAD - s.y)        * 5 * dt * 60;
      if (s.y > SZ-PAD)   s.vy -= (s.y - (SZ-PAD))   * 5 * dt * 60;

      s.vx *= DAMP; s.vy *= DAMP;

      // Cap speed
      const spd = Math.sqrt(s.vx*s.vx + s.vy*s.vy);
      if (spd > MAX_SPEED) { s.vx = s.vx/spd*MAX_SPEED; s.vy = s.vy/spd*MAX_SPEED; }

      s.x += s.vx * dt;
      s.y += s.vy * dt;
    });
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, SZ, SZ);

    // Cursor proximity glow — brighten the cell under cursor
    let cursorCell = -1, cursorDist = Infinity;
    if (isInside) {
      seeds.forEach((s, i) => {
        const d = Math.hypot(s.x - mx, s.y - my);
        if (d < cursorDist) { cursorDist = d; cursorCell = i; }
      });
    }

    // Draw cells
    seeds.forEach((s, idx) => {
      const poly = computeCell(idx);
      if (poly.length < 3) return;

      const isCursor = idx === cursorCell;
      const speed    = Math.sqrt(s.vx*s.vx + s.vy*s.vy);
      const motion   = Math.min(speed / 80, 1);

      // Subtle fill on active cell
      if (isCursor) {
        ctx.beginPath();
        ctx.moveTo(poly[0].x, poly[0].y);
        for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x, poly[i].y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.fill();
      }

      // Cell border
      ctx.beginPath();
      ctx.moveTo(poly[0].x, poly[0].y);
      for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x, poly[i].y);
      ctx.closePath();

      const baseAlpha = 0.16 + motion * 0.30;
      const alpha = isCursor ? Math.min(baseAlpha + 0.28, 0.85) : baseAlpha;
      ctx.strokeStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
      ctx.lineWidth = isCursor ? 1.1 : 0.7;
      ctx.stroke();
    });

    // Seed dots
    seeds.forEach((s, idx) => {
      const spd = Math.sqrt(s.vx*s.vx + s.vy*s.vy);
      const a   = 0.22 + Math.min(spd / 60, 0.55);
      ctx.beginPath();
      ctx.arc(s.x, s.y, 1.6, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.fill();
    });

    // Cursor dot
    if (isInside) {
      ctx.beginPath();
      ctx.arc(mx, my, 2, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.50)';
      ctx.fill();
    }
  }

  let hoverAudio = null, clickAudio = null;
  function initAudio() {
    if (hoverAudio) return;
    hoverAudio = new Audio('./sounds/selection.mp3');
    hoverAudio.volume = 0.06;
    clickAudio = new Audio('./sounds/selection.mp3');
    clickAudio.volume = 0.42;
  }
  function playHover() { initAudio(); hoverAudio.currentTime = 0; hoverAudio.play().catch(()=>{}); }
  function playClick() { initAudio(); clickAudio.currentTime = 0; clickAudio.play().catch(()=>{}); }

  let lastTick = {x:0,y:0}, lastTickMs = 0;
  function maybeTick(x, y) {
    const dx = x - lastTick.x, dy = y - lastTick.y;
    if (dx*dx + dy*dy < 48*48) return;
    const now = performance.now();
    if (now - lastTickMs < 220) return;
    lastTick = {x, y}; lastTickMs = now;
    playHover();
  }

  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
